blueprint:
  name: Danfoss Ally
  description: >
    Keep Danfoss Ally room temperature and load updated every 10 minutes.
    Synchronize setpoint changes with fresh temperature data when needed,
    and trigger immediate room refreshes on window state changes.
  domain: automation
  input:
    climate_entities:
      name: Climate entities
      description: Danfoss Ally thermostats in this room.
      selector:
        entity:
          domain: climate
          multiple: true
    temperature_entities:
      name: Temperature sensors
      description: Room sensors used for the external temperature average.
      selector:
        entity:
          domain: sensor
          device_class: temperature
          multiple: true
    window_entities:
      name: Window entities (optional)
      description: Changes trigger an immediate room-data refresh.
      default: []
      selector:
        entity:
          filter:
            - domain: sensor
            - domain: binary_sensor
          multiple: true
    heat_available_sensor:
      name: Heating supply temperature (optional)
      description: >
        Optional supply-temperature sensor for heat_available switches.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature
    heat_available_threshold:
      name: Heat available above (°C)
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "°C"
          mode: box

variables:
  room_climates: !input climate_entities

triggers:
  - trigger: state
    id: setpoint
    entity_id: !input climate_entities
    attribute: temperature
  - trigger: state
    id: window
    entity_id: !input window_entities
  - trigger: time_pattern
    id: periodic
    minutes: "/10"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {% set ns = namespace(peer_needs_update=false) %}
              {% if trigger.id == 'setpoint' and trigger.to_state is not none
                    and is_number(trigger.to_state.attributes.get('temperature')) %}
                {% set target = trigger.to_state.attributes.temperature | float %}
                {% for entity in room_climates %}
                  {% if entity != trigger.entity_id
                        and (not is_number(state_attr(entity, 'temperature'))
                             or (state_attr(entity, 'temperature') | float - target) | abs >= 0.01) %}
                    {% set ns.peer_needs_update = true %}
                  {% endif %}
                {% endfor %}
                {{ is_number(state_attr(trigger.entity_id, 'temperature'))
                   and (state_attr(trigger.entity_id, 'temperature') | float - target) | abs < 0.01
                   and (ns.peer_needs_update or room_climates | count == 1) }}
              {% else %}
                false
              {% endif %}
        sequence:
          - action: script.danfoss_ally_room_assistant
            data:
              climate_entities: !input climate_entities
              temperature_entities: !input temperature_entities
              update_readings: false
              requested_temperature: "{{ trigger.to_state.attributes.temperature }}"
              changed_entity: "{{ trigger.entity_id }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'window' }}"
        sequence:
          - action: script.danfoss_ally_room_assistant
            data:
              climate_entities: !input climate_entities
              temperature_entities: !input temperature_entities
              heat_available_sensor: !input heat_available_sensor
              heat_available_threshold: !input heat_available_threshold
    default:
      - condition: template
        value_template: "{{ trigger.id == 'periodic' }}"
      - variables:
          request_time_sync: "{{ now().minute == 0 }}"
      # Periodic jitter happens in a background script so a setpoint trigger
      # never waits for that delay before this automation can process it.
      - action: script.turn_on
        target:
          entity_id: script.danfoss_ally_room_assistant
        data:
          variables:
            climate_entities: !input climate_entities
            temperature_entities: !input temperature_entities
            heat_available_sensor: !input heat_available_sensor
            heat_available_threshold: !input heat_available_threshold
            stagger_room: true
            time_sync: "{{ request_time_sync }}"

# One automation instance per room. Mirrored setpoint state changes are
# queued and skipped once other TRVs have converged.
mode: queued
max: 100
trace:
  stored_traces: 100
