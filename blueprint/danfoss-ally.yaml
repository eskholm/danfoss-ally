blueprint:
  name: Danfoss Ally
  description: >
    Keep Danfoss Ally room temperatures and loads updated every 10 minutes,
    synchronize setpoint changes immediately, and refresh on window events.
    Stagger normal updates across rooms and time synchronization across an hour.
  domain: automation
  input:
    climate_entities:
      name: Climate entities
      description: Danfoss Ally thermostats in this room.
      selector:
        entity:
          domain: climate
          multiple: true
    temperature_entities:
      name: Temperature sensors
      description: Room sensors used for the mean external temperature.
      selector:
        entity:
          domain: sensor
          device_class: temperature
          multiple: true
    window_entities:
      name: Window entities (optional)
      description: Changes cause an immediate room-data refresh; no window mode is toggled.
      default: []
      selector:
        entity:
          filter:
            - domain: sensor
            - domain: binary_sensor
          multiple: true
    heat_available_sensor:
      name: Heating supply temperature (optional)
      description: >
        If selected, update each thermostat's heat_available switch according
        to the threshold. Leave empty to keep existing switch behavior.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature
    heat_available_threshold:
      name: Heat available above (°C)
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "°C"
          mode: box

triggers:
  - trigger: state
    id: setpoint
    entity_id: !input climate_entities
    attribute: temperature
  - trigger: state
    id: window
    entity_id: !input window_entities
  - trigger: time_pattern
    id: periodic
    minutes: "/10"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'setpoint' and trigger.to_state is not none
                 and is_number(trigger.to_state.attributes.get('temperature')) }}
        sequence:
          - action: script.danfoss_ally_room_assistant
            data:
              climate_entities: !input climate_entities
              temperature_entities: !input temperature_entities
              update_readings: false
              requested_temperature: "{{ trigger.to_state.attributes.temperature }}"
              changed_entity: "{{ trigger.entity_id }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'window' }}"
        sequence:
          - action: script.danfoss_ally_room_assistant
            data:
              climate_entities: !input climate_entities
              temperature_entities: !input temperature_entities
              heat_available_sensor: !input heat_available_sensor
              heat_available_threshold: !input heat_available_threshold
    default:
      - condition: template
        value_template: "{{ trigger.id == 'periodic' }}"
      # Capture the hourly decision BEFORE staggering this room's update.
      - variables:
          request_time_sync: "{{ now().minute == 0 }}"
      - delay:
          seconds: "{{ range(0, 120) | random }}"
      - action: script.danfoss_ally_room_assistant
        data:
          climate_entities: !input climate_entities
          temperature_entities: !input temperature_entities
          heat_available_sensor: !input heat_available_sensor
          heat_available_threshold: !input heat_available_threshold
          time_sync: "{{ request_time_sync }}"

mode: parallel
max: 30
trace:
  stored_traces: 100
